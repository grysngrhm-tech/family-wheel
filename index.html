<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Family wheel</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root { --ink:#2b2622; --muted:#7a7068; --faint:#a89e93; --rule:#ddd4c8; --bg:#fbf8f2; --paper:#fffdf8; --card:#f5f0e7;
          --accent:#5b3f1e; --link:#2a5d8f; --dw:min(560px, 42vw); --top:46px; --sheet:56dvh;
          --serif:Baskerville, "Hoefler Text", "Iowan Old Style", Georgia, serif; --sans:-apple-system, system-ui, "Helvetica Neue", sans-serif; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:15px/1.45 var(--serif); overflow:hidden; }
  button, select, input { font:13px var(--sans); color:var(--ink); }
  a { color:var(--link); }

  /* top bar */
  #top { position:fixed; inset:0 0 auto 0; height:var(--top); box-sizing:border-box; display:flex; gap:10px; align-items:center; padding:0 14px;
         background:var(--paper); border-bottom:1px solid var(--rule); z-index:6; font:13px var(--sans); }
  #brand { font:600 15px var(--serif); letter-spacing:.01em; white-space:nowrap; cursor:pointer; }
  #find { position:relative; }
  #q { width:250px; padding:6px 10px; border:1px solid var(--rule); border-radius:16px; background:var(--bg); outline:none; }
  #q:focus { border-color:#b9a990; background:#fff; }
  #results { position:absolute; top:34px; left:0; width:min(360px, 92vw); max-height:60vh; overflow:auto; background:#fff; border:1px solid var(--rule);
             border-radius:8px; box-shadow:0 8px 24px #0002; display:none; z-index:7; }
  #results.open { display:block; }
  #results div { padding:6px 10px; cursor:pointer; border-bottom:1px solid #f1ece4; }
  #results div.on, #results div:hover { background:#f6efe2; }
  #results b { font:15px var(--serif); } #results small { display:block; color:var(--muted); }
  .seg { display:flex; border:1px solid var(--rule); border-radius:6px; overflow:hidden; }
  .seg button { border:0; background:var(--paper); padding:5px 9px; cursor:pointer; border-left:1px solid var(--rule); }
  .seg button:first-child { border-left:0; }
  .seg button:hover { background:#f3ecdf; }
  #hint { color:var(--muted); margin-left:auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:6px; }
  #hint kbd { font:11px var(--sans); border:1px solid var(--rule); border-radius:3px; padding:0 4px; background:var(--bg); }
  #hint button { border:0; background:none; color:var(--faint); cursor:pointer; font-size:15px; }
  body.nohint #hint { display:none; }

  /* wheel and minimap */
  #wheel { position:fixed; top:var(--top); left:0; width:100vw; height:calc(100vh - var(--top)); height:calc(100dvh - var(--top)); display:block; touch-action:none; user-select:none; -webkit-user-select:none;
           transition:width .28s ease; }
  body.panel #wheel { width:calc(100vw - var(--dw)); }
  text { pointer-events:none; }
  #wheel { cursor:grab; } #wheel.grabbing, #wheel.grabbing path { cursor:grabbing !important; }
  path.cell { stroke:var(--paper); stroke-width:1; cursor:pointer; transition:filter .15s; }
  path.cell.unv { stroke:#b9ad9c; stroke-dasharray:3 2.5; stroke-width:.8; }
  path.cell:hover { filter:brightness(1.06) saturate(1.1); }
  .hub { cursor:pointer; }
  #nav { position:fixed; top:calc(var(--top) + 12px); left:12px; width:clamp(160px, 10vw, 230px); z-index:2; font:12px var(--sans); color:var(--muted);
         background:#fffdf8e6; border:1px solid var(--rule); border-radius:8px; padding:8px 10px 10px; -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); }
  #mini { width:100%; aspect-ratio:1; height:auto; display:block; cursor:pointer; }
  #crumb { margin-top:6px; line-height:1.5; }
  #crumb .plink { color:var(--ink); text-decoration:none; } #crumb .plink:hover { text-decoration:underline; }
  #crumb .gen { display:block; margin-top:4px; color:var(--faint); }

  /* the key, which is also the control: touch an entry to spotlight it */
  #key { margin-top:8px; border-top:1px solid var(--rule); padding-top:6px; }
  #key > summary { cursor:pointer; list-style:none; font:600 10.5px var(--sans); letter-spacing:.07em; text-transform:uppercase; color:var(--muted); padding:2px 0; }
  #key > summary::-webkit-details-marker { display:none; }
  #key > summary::after { content:"›"; float:right; transition:transform .15s; } #key[open] > summary::after { transform:rotate(90deg); }
  #keyb { max-height:min(46vh, 430px); overflow:auto; margin-right:-4px; padding-right:4px; }
  #keyb h5 { margin:8px 0 3px; font:600 10px var(--sans); letter-spacing:.06em; text-transform:uppercase; color:var(--faint); }
  #keyb button { display:flex; align-items:center; gap:6px; width:100%; border:0; background:none; padding:2px 3px; border-radius:4px; font:11.5px/1.35 var(--sans); color:var(--ink); text-align:left; cursor:pointer; }
  #keyb button:hover { background:#f3ecdf; } #keyb button.on { background:#5b3f1e; color:#fff; }
  #keyb button i { flex:none; width:13px; height:13px; border-radius:3px; } #keyb button small { margin-left:auto; color:var(--faint); } #keyb button.on small { color:#ecdfca; }
  #keyb i.unv { box-sizing:border-box; border:1px dashed #b9ad9c; } #keyb i.br { border:1.5px solid #8a7a66; border-bottom:0; height:6px; border-radius:0; box-sizing:border-box; }
  #spot { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); z-index:3; background:#2b2622ee; color:#fffdf8; border-radius:18px; padding:7px 8px 7px 15px; font:13px var(--sans);
          display:none; align-items:center; gap:10px; max-width:min(78vw, 640px); box-shadow:0 6px 20px #0003; }
  #spot.on { display:flex; } #spot span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #spot button { border:0; border-radius:12px; padding:4px 10px; background:#fffdf826; color:inherit; font:12px var(--sans); cursor:pointer; }
  body.panel #spot { left:calc((100vw - var(--dw)) / 2); }
  .bk { pointer-events:none; }

  /* stories in the panel */
  .st-list { display:flex; flex-direction:column; gap:1px; }
  .st-row { display:flex; gap:10px; align-items:baseline; padding:7px 2px; border-bottom:1px solid #efe8dc; cursor:pointer; font:15px/1.3 var(--serif); }
  .st-row:hover { background:#f8f2e7; } .st-row i { flex:none; width:8px; height:8px; border-radius:50%; align-self:center; }
  .st-row small { margin-left:auto; flex:none; font:11px var(--sans); color:var(--faint); }
  .st-via { margin:10px 0 2px; font:12px var(--sans); color:var(--muted); }
  details.st-more > summary { cursor:pointer; list-style:none; padding:8px 2px; font:12.5px var(--sans); color:var(--link); } details.st-more > summary::-webkit-details-marker { display:none; }
  details.st-more[open] > summary { display:none; }
  .reader h2 { margin:.1em 0 .25em; }
  .reader h2::after { content:""; display:block; width:52px; height:2.5px; margin-top:7px; background:var(--st-tint, var(--rule)); border-radius:1px; }
  .reader .proof { font:12px/1.4 var(--sans); color:var(--muted); margin:0 0 12px; display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
  .reader .proof b { display:inline-block; padding:2px 8px; border-radius:3px; background:#e8dfcf; color:var(--ink); font-weight:500; font-size:11px; letter-spacing:.04em; text-transform:uppercase; }
  .reader .loc-pill { display:inline-flex; align-items:center; gap:4px; font-size:12px; color:#544b43; }
  .reader .loc-ico { display:inline-block; flex:none; }
  .reader .bar { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 14px; } .reader .bar button { border:1px solid var(--rule); background:var(--card); border-radius:14px; padding:4px 12px; font:12.5px var(--sans); cursor:pointer; }
  .reader .bar button:hover { border-color:#a8977f; }
  .reader figure { margin:14px 0; } .reader figure img { display:block; max-width:100%; margin:0 auto; padding:4px; background:#fffdf9; border:1px solid #d5cab8; box-sizing:border-box; box-shadow:0 1px 4px rgba(43,38,34,.08); cursor:zoom-in; min-height:60px; }
  .reader figcaption { font:italic 13px/1.4 var(--serif); color:var(--muted); margin-top:6px; text-align:center; } .reader figcaption p { margin:0; }
  .reader .story { font-size:16px; line-height:1.62; }
  .reader .story > p:first-of-type::first-letter { float:left; font-size:2.6em; line-height:.85; padding-right:6px; padding-top:2px; color:var(--st-tint, var(--ink)); }
  .reader .ev-box { margin-top:14px; padding:10px 14px; background:#faf7f1; border-left:3px solid var(--st-tint, var(--rule)); font:13px/1.45 var(--sans); color:#5b524a; }
  .reader .ev-box b { color:var(--ink); font-weight:600; font-size:11.5px; letter-spacing:.04em; text-transform:uppercase; margin-right:5px; }
  .reader table { border-collapse:collapse; font-size:13.5px; margin:10px 0; width:100%; } .reader td { border-bottom:1px solid #e6ddd0; padding:4px 8px 4px 0; vertical-align:top; }
  .reader .ppl { margin-top:16px; padding-top:10px; border-top:1px solid var(--rule); font-size:14px; line-height:1.7; }

  /* side panel */
  #panel { position:fixed; top:var(--top); right:0; bottom:0; width:var(--dw); box-sizing:border-box; background:var(--paper); border-left:1px solid var(--rule);
           overflow:auto; padding:16px 20px 48px; z-index:3; transform:translateX(102%); visibility:hidden;
           transition:transform .28s ease, visibility 0s linear .28s; box-shadow:-6px 0 18px #0000; }
  body.panel #panel { transform:none; visibility:visible; transition:transform .28s ease; box-shadow:-6px 0 18px #0000000d; }
  .x { float:right; cursor:pointer; font:20px var(--sans); color:var(--faint); border:0; background:none; margin:-4px -6px 0 8px; }
  .x:hover { color:var(--ink); }
  .ph { display:flex; gap:14px; align-items:flex-start; }
  .ph img { width:76px; height:92px; object-fit:cover; border-radius:4px; border:1px solid var(--rule); flex:none; cursor:pointer; }
  .kicker { font:600 11px var(--sans); letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  .kicker.rel { font:13px var(--sans); letter-spacing:0; text-transform:none; }
  #panel h2 { margin:.1em 0 0; font-size:25px; line-height:1.15; font-weight:normal; }
  .sub { color:var(--muted); font:13px var(--sans); margin-top:2px; }
  /* the summary card: vitals, family links, work, the story's opening */
  .sum { background:var(--card); border-radius:10px; padding:10px 14px 12px; margin:12px 0 4px; }
  .vit { display:grid; grid-template-columns:72px 1fr; gap:10px; margin:4px 0; line-height:1.4; }
  .vit > b { font:600 10.5px/1.95 var(--sans); color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .vit .sep { color:var(--faint); }
  .vit .plink { color:var(--ink); text-decoration:underline; text-decoration-color:#cbbfae; text-underline-offset:2px; }
  .vit .plink:hover { color:var(--link); text-decoration-color:currentColor; }
  .lk.alt .plink { color:var(--muted); }
  .vit > span { min-width:0; overflow-wrap:break-word; }
  .cd { display:inline-block; width:7px; height:7px; border-radius:50%; margin:0 0 1px 5px; vertical-align:middle; background:#d8d0c3; }
  .cd.confirmed { background:#3d6b3d; } .cd.probable { background:#8db37e; }
  .cd.possible { background:transparent; box-shadow:inset 0 0 0 1.5px #b59f74; } .cd.family-lore { background:#c79bc7; }
  .qual { font:italic 12px var(--sans); color:var(--faint); margin-left:3px; }
  .lede { margin-top:9px; padding-top:9px; border-top:1px solid #e6ddd0; line-height:1.5; }
  /* the family-history books and posters on the four grandparents */
  .eds h3 { margin-top:1.1em; }
  .gtiles { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .ed { border:1px solid var(--rule); background:var(--card); border-radius:10px; overflow:hidden; cursor:pointer; display:flex; flex-direction:column; }
  .ed:hover { border-color:#a8977f; box-shadow:0 4px 14px #0000001f; }
  .ed .gim { height:168px; display:flex; align-items:center; justify-content:center; padding:14px; box-sizing:border-box; background:#ece4d6; }
  .ed .gim img { max-width:100%; max-height:100%; box-shadow:0 2px 10px #3b2a1430; background:#fff; border-radius:2px; }
  .ed .gcap { padding:8px 10px 10px; font:12px/1.35 var(--sans); color:var(--muted); display:flex; flex-direction:column; gap:3px; flex:1; }
  .ed .gcap b { font:15px/1.25 var(--serif); color:var(--ink); font-weight:normal; }
  .ed .gcap a { margin-top:auto; padding-top:3px; }
  h3 { margin:1.3em 0 .5em; font:600 11px var(--sans); letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
  h3 span { font-weight:400; }
  .recs { display:grid; grid-template-columns:repeat(auto-fill, minmax(122px, 1fr)); gap:10px; }
  .rec { cursor:pointer; border:1px solid var(--rule); background:var(--card); border-radius:6px; overflow:hidden; font:11.5px/1.3 var(--sans); }
  .rec:hover { border-color:#a8977f; box-shadow:0 3px 10px #0002; }
  .rec .im { height:118px; background:#e9e1d4 center/cover no-repeat; position:relative; }
  .recs.lead .rec:first-child { grid-column:span 2; grid-row:span 2; display:flex; flex-direction:column; }
  .recs.lead .rec:first-child .im { flex:1; min-height:200px; background-position:center top; }
  .recs.lead .rec:first-child .cap { font-size:12.5px; }
  .rec .pg { position:absolute; right:5px; bottom:5px; background:#000a; color:#fff; padding:0 5px; border-radius:3px; font-size:10.5px; }
  .rec .cap { padding:5px 7px 7px; color:#4a423b; }
  details.phs > summary { cursor:pointer; list-style:none; font:12.5px/1 var(--sans); color:var(--muted); padding:12px 0 4px; }
  details.phs > summary::-webkit-details-marker { display:none; }
  details.phs[open] > summary { display:none; }
  details.phs > .recs { margin-top:10px; }
  .recs.photos .cap { color:var(--muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; padding-bottom:0; margin-bottom:7px; }
  .rec .cap b { display:block; color:var(--ink); font-weight:600; }
  .fact { margin:.35em 0; font-size:14px; }
  .fact.alt { opacity:.55; }
  .note { color:var(--muted); font:12.5px/1.45 var(--sans); }
  .tag { font:10.5px var(--sans); padding:0 6px; border-radius:8px; background:#e6e1d8; color:#5a524a; margin-left:4px; white-space:nowrap; }
  .chip { display:inline-block; font:10.5px var(--sans); background:#efe9df; border:1px solid var(--rule); border-radius:4px; padding:0 4px; margin:0 1px; cursor:pointer; vertical-align:1px; }
  .chip.img { background:#e3ecf5; border-color:#9bb3cc; }
  .plink { color:var(--link); cursor:pointer; }
  .plink:hover { text-decoration:underline; }
  /* Full story and Facts: collapsed toggles at the foot of the summary card, opening in place */
  .sum details.more { border-top:1px solid #e6ddd0; }
  .sum .vit + details.more, .sum .lede + details.more { margin-top:9px; }
  .sum > details.more:first-child { border-top:0; }
  .sum:has(details.st[open]) .lede { display:none; }      /* the open story starts with the same lines */
  .sum details.more summary { cursor:pointer; font:600 10.5px var(--sans); letter-spacing:.07em; text-transform:uppercase; color:var(--muted);
    padding:9px 0 8px; list-style:none; display:flex; align-items:center; gap:7px; -webkit-user-select:none; user-select:none; }
  .sum details.more summary span { font-weight:400; letter-spacing:.03em; }
  .sum details.more summary::-webkit-details-marker { display:none; }
  .sum details.more summary::before { content:"›"; font:15px/1 var(--sans); color:var(--faint); transition:transform .15s; width:9px; text-align:center; }
  .sum details.more[open] summary::before { transform:rotate(90deg); }
  .sum details.more summary:hover { color:var(--ink); }
  .sum details.more:last-child summary { padding-bottom:0; } .sum details.more[open]:last-child summary { padding-bottom:8px; }
  .sum .story, .sum .facts { padding:2px 0 10px; }
  .sum .story { font-size:15px; line-height:1.55; } .sum .story p:first-child { margin-top:0; }
  .sum .facts .fact { padding:5px 0; margin:0; border-top:1px solid #ece4d8; font-size:13.5px; line-height:1.45; }
  .sum .facts .fact:first-child { border-top:0; padding-top:0; }
  .fact .cd { margin-left:2px; }
  .story p { margin:.55em 0; } .story h4 { font:600 13px var(--sans); margin:1em 0 .3em; }

  /* record viewer */
  #viewer { position:fixed; inset:0; background:#1b1917; z-index:10; display:none; grid-template-columns:1fr min(440px, 36vw); grid-template-rows:1fr 92px; color:#eee; }
  #viewer.open { display:grid; }
  #stage { grid-column:1; grid-row:1; position:relative; overflow:hidden; cursor:grab; background:#111; }
  #stage.panning { cursor:grabbing; }
  #stage img.full { position:absolute; left:0; top:0; transform-origin:0 0; user-select:none; -webkit-user-drag:none; max-width:none; opacity:0; transition:opacity .14s ease; }
  #stage img.full.loaded { opacity:1; }
  #stage .spin { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font:13px var(--sans); color:#ccc; background:#0009; padding:8px 14px; border-radius:16px; pointer-events:none; z-index:1; }
  #stage iframe { width:100%; height:100%; border:0; background:#fff; }
  #stage .nav { position:absolute; top:50%; transform:translateY(-50%); font:30px var(--sans); background:#0006; color:#fff; border:0; width:46px; height:76px; cursor:pointer; z-index:2; border-radius:4px; }
  #stage .nav:hover { background:#000a; }
  #stage .zoomtip { position:absolute; left:12px; bottom:10px; font:12px var(--sans); color:#bbb; background:#0008; padding:3px 8px; border-radius:4px; z-index:2; }
  #stage .msg { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; color:#bbb; font:15px var(--sans); text-align:center; padding:40px; }
  #stage .msg img { max-width:60%; max-height:60%; opacity:.85; }
  #stage .msg a { color:#9cf; }
  #vside { grid-column:2; grid-row:1 / span 2; background:var(--paper); color:var(--ink); overflow:auto; padding:16px 20px 30px; }
  #vside h2 { font-size:20px; margin:.3em 0 .2em; font-weight:normal; line-height:1.25; }
  #vside .shows { background:var(--card); border-radius:8px; padding:4px 12px; }
  #vside .meta { display:grid; grid-template-columns:90px 1fr; gap:2px 10px; font:12.5px/1.5 var(--sans); margin:10px 0; }
  #vside .meta b { color:var(--muted); font-weight:600; }
  #vside pre { white-space:pre-wrap; font:13px/1.5 var(--serif); background:var(--card); padding:10px 12px; border-left:3px solid var(--rule); margin:0; }
  #strip { grid-column:1; grid-row:2; display:flex; gap:6px; overflow-x:auto; padding:8px; background:#24211e; }
  #strip div { flex:0 0 auto; width:66px; height:76px; background:#333 center/cover no-repeat; cursor:pointer; border:2px solid transparent; opacity:.7; border-radius:3px; }
  #strip div.on { border-color:#e8c98a; opacity:1; }

  /* the record viewer's own close button, and the pdf bar for touch screens */
  #stage .vx { position:absolute; top:8px; right:8px; z-index:3; width:44px; height:44px; border-radius:22px; border:0; background:#0008; color:#fff; font:22px var(--sans); cursor:pointer; }
  #stage .pdfbar { position:absolute; left:50%; bottom:12px; transform:translateX(-50%); z-index:3; font:14px var(--sans); background:#000c; color:#ddd; padding:8px 14px; border-radius:20px; white-space:nowrap; }
  #stage .pdfbar a { color:#9cf; }
  #stage { touch-action:none; }

  /* unlock screen (published copy only) and the Lock button */
  #lock { position:fixed; inset:0; z-index:30; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:16px; }
  #lock[hidden] { display:none; }
  #lock form { width:min(340px, 100%); box-sizing:border-box; background:var(--paper); border:1px solid var(--rule); border-radius:12px; padding:30px 24px 22px; box-shadow:0 10px 30px #0000000f; text-align:center; }
  #lock { background: radial-gradient(ellipse at 50% 35%, #fffdf8 0%, var(--bg) 55%, #efe8dc 100%); }
  #lock form { padding:26px 28px 22px; border-radius:16px; box-shadow:0 18px 50px #3b2a1418; width:min(380px, 100%); }
  #lock .lockfan { display:block; width:180px; margin:0 auto 10px; }
  #lock h1 { font:normal 31px var(--serif); margin:0 0 4px; letter-spacing:.01em; }
  #lock .lockby { margin:0 0 14px; font:14px var(--serif); font-style:italic; color:var(--muted); }
  #lock .lockby a { color:inherit; text-decoration:none; border-bottom:1px solid var(--rule); }
  #lock .locknote { margin:0 0 16px; font:13.5px var(--sans); color:var(--muted); line-height:1.4; }
  #lock input[type=password] { width:100%; box-sizing:border-box; font:16px var(--sans); padding:12px; border:1px solid var(--rule); border-radius:8px; background:#fff; }
  #lock label { display:flex; gap:8px; align-items:center; justify-content:center; margin:14px 0; font:15px var(--sans); color:var(--muted); }
  #lock input[type=checkbox] { width:20px; height:20px; }
  #lock button { width:100%; padding:12px; font:600 16px var(--sans); background:var(--accent); color:#fff; border:0; border-radius:8px; cursor:pointer; }
  #lock button:disabled { opacity:.6; }
  #lockmsg { min-height:1.4em; margin-top:12px; font:14px var(--sans); color:#a33; }
  #lockmsg.busy { color:var(--muted); }
  #bLock { border:1px solid var(--rule); border-radius:6px; background:var(--paper); padding:5px 10px; cursor:pointer; }
  #bLock[hidden] { display:none; }

  /* touch: the arrow pad under the wheel, large targets, no hover-only cues */
  #pad { position:fixed; left:0; width:100vw; bottom:calc(8px + env(safe-area-inset-bottom)); z-index:2; display:none; justify-content:center; gap:8px; pointer-events:none; transition:width .28s ease; }
  #pad button { pointer-events:auto; width:52px; height:48px; border:1px solid var(--rule); border-radius:12px; background:#fffdf8ee; font:20px var(--sans); color:var(--accent); box-shadow:0 2px 8px #0000000f; cursor:pointer; }
  #pad button:active { background:#efe5d4; }
  .hint-touch { display:none; }
  @media (pointer:coarse) {
    :root { --top:54px; }
    #q { font-size:16px; }
    #bLock { font-size:15px; padding:8px 8px; }
    .x { font-size:26px; padding:6px 10px; }
    .chip { padding:2px 6px; }
    .hint-mouse { display:none; } .hint-touch { display:inline; }
  }
  @media (pointer:coarse), (max-width:900px) {
    #pad { display:flex; }
    .seg { display:none; }
    body.panel #pad { width:calc(100vw - var(--dw)); }
  }
  @media (max-width:1100px) { #hint { display:none; } }
  @media (max-width:1366px) { :root { --dw:min(440px, 42vw); } }
  @media (max-width:700px) {
    #top { gap:6px; padding:0 8px; }
    #brand { display:none; }
    #find { flex:1; min-width:0; } #q { width:100%; box-sizing:border-box; }
    #key { display:none; } #nav { width:92px; padding:4px; top:calc(var(--top) + 8px); left:8px; } #crumb { display:none; }
  }
  /* the side panel becomes a bottom sheet on phones and on tablets held upright */
  @media (max-width:700px), (max-width:1024px) and (orientation:portrait) {
    #panel { top:auto; left:0; right:0; bottom:0; width:auto; height:var(--sheet); border-left:0; border-top:1px solid var(--rule);
             border-radius:16px 16px 0 0; transform:translateY(102%); padding-top:0; padding-bottom:calc(48px + env(safe-area-inset-bottom)); box-shadow:0 -6px 18px #0000; transition:transform .28s ease, height .28s ease, visibility 0s linear .28s; }
    body.panel #panel { box-shadow:0 -6px 18px #00000014; transition:transform .28s ease, height .28s ease; }
    body.sheetfull { --sheet:calc(100dvh - var(--top) - 8px); }
    body.panel #wheel { width:100vw; height:calc(100dvh - var(--top) - var(--sheet)); }
    body.panel #pad { width:100vw; bottom:calc(var(--sheet) + 8px); }

  // holding the branch it opens (a person's ID; empty for the whole tree). Try this key on each: {master, branch}.
